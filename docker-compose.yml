services:
  db:
    image: mysql:8.0
    container_name: mysql-db
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped

  backend:
    build:
      context: ./Aspirasi-Siswa-Backend
      dockerfile: Dockerfile
    container_name: backend-app
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=db
    env_file:
      - ./Aspirasi-Siswa-Backend/.env
    volumes:
      - ./Aspirasi-Siswa-Backend/internal/storage:/app/internal/storage
    depends_on:
      - db
    restart: unless-stopped

  frontend:
    build:
      context: ./Aspirasi-Siswa-Frontend
      dockerfile: Dockerfile
    container_name: frontend-app
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mysql_data: